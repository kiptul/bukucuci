<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BukuCuci — tidak ada koneksi</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: #e6e0d3;
        color: #17161a;
        font-family:
          "IBM Plex Sans",
          ui-sans-serif,
          system-ui,
          sans-serif;
      }
      .cap {
        font-family: ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #8b8477;
      }
      h1 {
        margin: 0.75rem 0 0;
        font-size: 30px;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0.85rem 0 0;
        max-width: 32ch;
        line-height: 1.6;
        color: #575146;
      }
      .garis {
        display: block;
        width: 48px;
        height: 1px;
        margin-top: 1.5rem;
        background: #0b6b5b;
      }
    </style>
  </head>
  <body>
    <p class="cap">BukuCuci</p>
    <h1>Tidak ada koneksi.</h1>
    <span class="garis"></span>
    <p>
      Order yang sudah tersimpan aman. Sambungkan internet lagi, lalu muat ulang
      halaman ini untuk melanjutkan.
    </p>
  </body>
</html>
