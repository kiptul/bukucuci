; Buka folder ini sebagai project PlatformIO (bukan akar repo Kelar).
;
; src_dir = . dipakai supaya berkas .ino tetap berada di samping berkas ini,
; sejajar dengan esp32_kelar/ yang memang disusun untuk Arduino IDE. Tanpa
; baris itu PlatformIO mencari src/ dan melaporkan project kosong.

[platformio]
src_dir = .

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed = 115200

; Papan ini memakai USB-serial CH340 dan selalu muncul sebagai ttyUSB0 di
; laptop ini. Dikunci agar PlatformIO tidak salah pilih saat ada perangkat
; serial lain menancap.
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
